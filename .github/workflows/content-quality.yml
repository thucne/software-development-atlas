name: Content quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: content-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, lint, typecheck, build and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test lesson contracts and content freshness
        run: pnpm test

      - name: Inventory all substantive English/Vietnamese lessons
        run: pnpm audit:content

      - name: Publish content triage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-content-inventory
          path: audit-reports/content-inventory.*
          if-no-files-found: warn
          retention-days: 14

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build docs and MDX routes
        run: pnpm build

      - name: Install Chromium and dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e
